[env:esp32c3_supermini]
; Select the firmware test mode near the top of src/main.cpp.
; Compatible ESP32-C3 profile with 4 MB flash; not an exact SuperMini Plus profile.
platform = espressif32 @ 6.12.0
board = esp32-c3-devkitm-1
framework = arduino

; Use the ESP32-C3's native USB connector for serial communication.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Keep the monitor baud rate aligned with SERIAL_BAUD in src/main.cpp.
monitor_speed = 115200
; Avoid toggling reset/boot control lines when opening the serial monitor.
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800

lib_deps =
    adafruit/Adafruit MPU6050 @ 2.2.6

; If several serial ports are available, adjust and uncomment these settings.
; upload_port = COM5
; monitor_port = COM5
