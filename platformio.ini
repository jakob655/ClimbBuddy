[env:esp32c3_supermini]
; Ein gemeinsames Projekt: Testmodus oben in src/main.cpp waehlen.
; Kompatibles ESP32-C3-Profil (4 MB Flash), kein exaktes SuperMini-Plus-Profil.
platform = espressif32 @ 6.12.0
board = esp32-c3-devkitm-1
framework = arduino

; SuperMini: Serial ueber den nativen USB-Anschluss des ESP32-C3.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800

lib_deps =
    adafruit/Adafruit MPU6050 @ 2.2.6

; Bei mehreren COM-Ports ggf. anpassen und auskommentieren:
; upload_port = COM5
; monitor_port = COM5
